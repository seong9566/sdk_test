<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        html, body, #map { margin: 0; width: 100%; height: 100%; }
        .panel {
            position: absolute; left: 8px; z-index: 10;
            padding: 6px 10px; background: rgba(0, 0, 0, .7); color: #fff;
            font: 14px/1.4 monospace; white-space: pre; border-radius: 4px;
        }
        #status { top: 8px; }
        #relay { bottom: 28px; }
        .peer {
            padding: 2px 8px; background: #e53935; color: #fff; border: 2px solid #fff;
            border-radius: 12px; font: bold 13px sans-serif; box-shadow: 0 1px 4px rgba(0, 0, 0, .4);
            transform: translateY(-50%);
        }
    </style>
</head>
<body>
<div id="map"></div>
<div id="status" class="panel">Kakao SDK 로딩 중…</div>
<div id="relay" class="panel">relay 연결 중…</div>
<script>
    var map = null, marker = null, pending = null;
    var statusEl = document.getElementById('status');

    function setStatus(text) { statusEl.textContent = text; }

    // 네이티브(LocationManager)에서 evaluateJavascript로 호출한다.
    window.updateLocation = function (lat, lng, accuracy, provider) {
        if (!map) { pending = [lat, lng, accuracy, provider]; return; }
        var pos = new kakao.maps.LatLng(lat, lng);
        if (!marker) { marker = new kakao.maps.Marker({ position: pos, map: map }); }
        else { marker.setPosition(pos); }
        map.panTo(pos);
        setStatus('provider=' + provider + '\nlat=' + lat.toFixed(6) + ' lng=' + lng.toFixed(6)
            + '\naccuracy=' + accuracy + 'm  ' + new Date().toLocaleTimeString());
    };

    // 상대 마커: 참가자 id별 CustomOverlay. 지도 로드 전 수신분은 마지막 좌표만 보관했다가 그린다.
    var peers = {}, pendingPeers = {}, relayText = 'relay 연결 중…';

    function renderRelay() {
        document.getElementById('relay').textContent = relayText + '  peers=' + Object.keys(peers).length;
    }

    window.updatePeer = function (id, lat, lng) {
        if (!map) { pendingPeers[id] = [lat, lng]; return; }
        var pos = new kakao.maps.LatLng(lat, lng);
        if (!peers[id]) {
            var el = document.createElement('div');
            el.className = 'peer';
            el.textContent = id;
            peers[id] = new kakao.maps.CustomOverlay({ position: pos, content: el, map: map });
            renderRelay();
        } else {
            peers[id].setPosition(pos);
        }
    };

    window.removePeer = function (id) {
        delete pendingPeers[id];
        if (peers[id]) { peers[id].setMap(null); delete peers[id]; renderRelay(); }
    };

    window.setRelayStatus = function (text) { relayText = text; renderRelay(); };

    function onSdkError() {
        setStatus('Kakao SDK 로드 실패\n- KAKAO_JS_KEY 확인\n- 카카오 콘솔 Web 도메인에 https://localhost 등록 확인\n- 네트워크 확인');
    }
</script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=__KAKAO_JS_KEY__&autoload=false"
        onerror="onSdkError()"></script>
<script>
    if (window.kakao && kakao.maps) {
        kakao.maps.load(function () {
            map = new kakao.maps.Map(document.getElementById('map'), {
                center: new kakao.maps.LatLng(37.5665, 126.9780), // 위치 수신 전 기본값: 서울시청
                level: 3
            });
            setStatus('지도 로드 완료, 위치 대기 중…');
            if (pending) { window.updateLocation.apply(null, pending); pending = null; }
            for (var id in pendingPeers) { window.updatePeer(id, pendingPeers[id][0], pendingPeers[id][1]); }
            pendingPeers = {};
        });
    } else {
        onSdkError();
    }
</script>
</body>
</html>
